name: Update fuel prices
on:
  schedule:
    - cron: "0 14 */1 * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scraper.py"
      - "update_prices.py"
      - "build_dashboard.py"
      - "international_prices.py"
      - "requirements.txt"
      - ".github/workflows/update-fuel-prices.yml"

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate Python and MEM date parser
        run: |
          python -m py_compile scraper.py international_prices.py build_dashboard.py update_prices.py
          python - <<'PY'
          from scraper import _parse_mem_date

          assert _parse_mem_date("Monitoreo Actual: 25/09/2026").strftime("%Y-%m-%d") == "2026-09-25"
          assert _parse_mem_date("Monitoreo Actual: 25 de septiembre de 2026").strftime("%Y-%m-%d") == "2026-09-25"
          print("Parser de fechas MEM: OK")
          PY
      - name: Update data and dashboard
        env:
          CLOUDFLARE_PROXY_URL: ${{ secrets.CLOUDFLARE_PROXY_URL }}
        run: python update_prices.py
      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add precios_historicos.csv precios_internacionales.csv index.html fuel_prices.log last_excel_url.txt || true
          git diff --cached --quiet || git commit -m "Actualizar precios de combustibles"
          git pull origin main --ff-only || git pull origin main --strategy-option=ours
          git push
